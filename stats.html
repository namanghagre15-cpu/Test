<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Stats · Student Expense Tracker</title>
<meta name="theme-color" content="#171e19" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          charcoal: '#171e19',
          crimson: '#ca0013',
          sage: '#b7c6c2',
          offwhite: '#eeebe3',
        },
        fontFamily: { sans: ['Nunito', 'sans-serif'] },
        borderRadius: { '4xl': '2.5rem' },
        boxShadow: {
          soft: '0 20px 50px -12px rgba(0,0,0,0.08)',
          redglow: '0 10px 30px -5px rgba(202,0,19,0.35)',
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-offwhite text-charcoal font-sans" data-page="stats">

<div class="page-shell max-w-md mx-auto px-5">

  <header class="pt-14 pb-6">
    <p class="text-[12px] uppercase tracking-widest font-bold text-sage">Know your money</p>
    <h1 class="text-[30px] font-black leading-tight">Stats & Analytics</h1>
  </header>

  <!-- Income vs Expense Bento row -->
  <section class="grid grid-cols-2 gap-3 mb-6">
    <div class="bg-white rounded-3xl border border-sage-soft p-4">
      <div class="bento-icon mb-2">📥</div>
      <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">Income (month)</p>
      <p class="text-[18px] font-black" id="month-income">₹0</p>
    </div>
    <div class="bg-white rounded-3xl border border-sage-soft p-4">
      <div class="bento-icon mb-2">📤</div>
      <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">Expense (month)</p>
      <p class="text-[18px] font-black" id="month-expense">₹0</p>
    </div>
  </section>

  <!-- Weekly Spend Trend -->
  <section class="bg-white rounded-4xl shadow-soft p-6 mb-6">
    <h2 class="text-[20px] font-black mb-1">This Week's Spend</h2>
    <p class="text-[12px] font-bold text-sage mb-4">Daily expense trend</p>
    <div class="relative h-48">
      <canvas id="weekly-chart"></canvas>
    </div>
  </section>

  <!-- Category Breakdown -->
  <section class="bg-white rounded-4xl shadow-soft p-6 mb-6">
    <h2 class="text-[20px] font-black mb-1">Category Breakdown</h2>
    <p class="text-[12px] font-bold text-sage mb-4">Where your money goes</p>
    <div class="relative h-56 flex items-center justify-center">
      <canvas id="category-chart"></canvas>
    </div>
    <div id="category-empty" class="hidden text-center py-6">
      <p class="text-4xl mb-2">📊</p>
      <p class="text-[14px] font-bold text-sage">No expenses logged yet.</p>
    </div>
    <div id="category-legend" class="grid grid-cols-2 gap-2 mt-4"></div>
  </section>

  <!-- Needs vs Wants -->
  <section class="bg-white rounded-4xl shadow-soft p-6 mb-6">
    <h2 class="text-[20px] font-black mb-1">Needs vs Wants</h2>
    <p class="text-[12px] font-bold text-sage mb-4">Discipline check</p>
    <div class="relative h-40">
      <canvas id="needs-wants-chart"></canvas>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="glass-card rounded-2xl p-3 border border-sage-soft">
        <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">🧠 Needs</p>
        <p class="text-[14px] font-black" id="need-amount">₹0</p>
      </div>
      <div class="glass-card rounded-2xl p-3 border border-sage-soft">
        <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">✨ Wants</p>
        <p class="text-[14px] font-black" id="want-amount">₹0</p>
      </div>
    </div>
  </section>

</div>

<div id="bottom-nav"></div>

<script type="module" src="js/stats.js"></script>
</body>
</html>
