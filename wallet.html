<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Wallet · Money follow</title>
<meta name="theme-color" content="#171e19" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<script>
  try {
    var mfDark = JSON.parse(localStorage.getItem('mf_dark_mode') || 'false');
    document.documentElement.setAttribute('data-theme', mfDark ? 'dark' : 'light');
  } catch (e) {}
</script>
<script src="js/boot-guard.js"></script>
<script src="https://unpkg.com/dexie@3/dist/dexie.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: ['selector', '[data-theme="dark"]'],
    theme: {
      extend: {
        colors: {
          charcoal: '#171e19', crimson: '#ca0013', sage: '#b7c6c2', offwhite: '#eeebe3',
          surface: 'var(--color-surface)', card: 'var(--color-card)', ink: 'var(--color-ink)',
        },
        fontFamily: { sans: ['Nunito', 'sans-serif'] },
        borderRadius: { '4xl': '2.5rem' },
        boxShadow: { soft: '0 20px 50px -12px rgba(0,0,0,0.08)', redglow: '0 10px 30px -5px rgba(202,0,19,0.35)' },
      },
    },
  };
</script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-surface text-ink font-sans" data-page="wallet">

<div class="page-shell max-w-md mx-auto px-5">

  <header class="flex items-center justify-between pt-14 pb-6">
    <div>
      <p class="text-[12px] uppercase tracking-widest font-bold text-sage">Manage funds</p>
      <h1 class="text-[30px] font-black leading-tight">Your Wallet</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="ghost-toggle-btn" class="w-11 h-11 rounded-full bg-card border border-sage-soft shadow-soft flex items-center justify-center text-ink" aria-label="Toggle privacy mode"></button>
      <a href="settings.html" class="w-11 h-11 rounded-full bg-card border border-sage-soft shadow-soft flex items-center justify-center text-ink" aria-label="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.6a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H4.4a2.06 2.06 0 1 1 0-4.12h.09A1.7 1.7 0 0 0 6.05 6.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34H10.6A1.7 1.7 0 0 0 11.63 1H11.7a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87v.06a1.7 1.7 0 0 0 1.56 1.03h.09a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/></svg></a>
    </div>
  </header>

  <!-- Hero: two wallet balances -->
  <section class="relative overflow-hidden bg-card rounded-4xl shadow-soft p-6 mb-6">
    <div class="decor-blob"></div>
    <div class="relative z-10 grid grid-cols-2 gap-3">
      <div class="glass-card rounded-3xl p-4 border border-sage-soft">
        <div class="bento-icon mb-3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0"/></svg></div>
        <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">Cash in hand</p>
        <p class="text-[22px] font-black mf-amt" id="cash-balance">₹0</p>
      </div>
      <div class="glass-card rounded-3xl p-4 border border-sage-soft">
        <div class="bento-icon mb-3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg></div>
        <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-1">Online / UPI</p>
        <p class="text-[22px] font-black mf-amt" id="online-balance">₹0</p>
      </div>
    </div>
  </section>

  <!-- Tabs: Add Money vs Transfer -->
  <div class="segmented mb-5">
    <button id="tab-income" class="active flex items-center justify-center gap-1.5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add Pocket Money</button>
    <button id="tab-transfer" class="flex items-center justify-center gap-1.5"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v13.5M7 5 3.5 8.5M7 5l3.5 3.5"/><path d="M17 19V5.5M17 19l3.5-3.5M17 19l-3.5-3.5"/></svg>Transfer</button>
  </div>

  <!-- Add Pocket Money / Income Form -->
  <section id="income-form-section" class="bg-card rounded-4xl shadow-soft p-6 mb-6">
    <h2 class="text-[20px] font-black mb-4">Add Pocket Money</h2>

    <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-2">Amount</p>
    <div class="flex items-center gap-2 mb-5 bg-sage/10 border border-sage-soft rounded-2xl px-4 py-3">
      <span class="text-[22px] font-black text-crimson">₹</span>
      <input id="income-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
        class="text-[22px] font-black bg-transparent outline-none w-full placeholder:text-sage text-ink" />
    </div>

    <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-2">Add to</p>
    <div class="grid grid-cols-2 gap-3 mb-5">
      <button data-wallet-type="cash" class="wallet-type-btn py-3 rounded-2xl border border-sage-soft font-black text-[14px] flex items-center justify-center gap-1.5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0"/></svg>Cash</button>
      <button data-wallet-type="online" class="wallet-type-btn py-3 rounded-2xl border border-sage-soft font-black text-[14px] flex items-center justify-center gap-1.5"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg>Online</button>
    </div>

    <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-2">Source (optional)</p>
    <input id="income-note" type="text" placeholder="e.g. Monthly allowance from parents"
      class="w-full bg-sage/10 border border-sage-soft rounded-2xl px-4 py-3 text-[14px] font-semibold outline-none placeholder:text-sage mb-5 text-ink" />

    <button id="add-income-btn" class="w-full py-4 rounded-3xl bg-crimson text-white font-black text-[15px] shadow-redglow flex items-center justify-center gap-2">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Add Pocket Money</span>
    </button>
    <p id="income-error" class="hidden text-center text-[12px] font-bold text-crimson mt-3"></p>
  </section>

  <!-- Transfer Form -->
  <section id="transfer-form-section" class="hidden bg-card rounded-4xl shadow-soft p-6 mb-6">
    <h2 class="text-[20px] font-black mb-4">Transfer Between Wallets</h2>

    <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-2">Amount</p>
    <div class="flex items-center gap-2 mb-5 bg-sage/10 border border-sage-soft rounded-2xl px-4 py-3">
      <span class="text-[22px] font-black text-crimson">₹</span>
      <input id="transfer-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"
        class="text-[22px] font-black bg-transparent outline-none w-full placeholder:text-sage text-ink" />
    </div>

    <p class="text-[10px] uppercase tracking-widest font-bold text-sage mb-2">Direction</p>
    <div class="grid grid-cols-2 gap-3 mb-5">
      <button data-direction="cash-to-online" class="transfer-dir-btn py-3 rounded-2xl border border-sage-soft font-black text-[13px]"><span class="flex items-center justify-center gap-1.5 mb-1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0"/></svg><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg></span>Cash to Online</button>
      <button data-direction="online-to-cash" class="transfer-dir-btn py-3 rounded-2xl border border-sage-soft font-black text-[13px]"><span class="flex items-center justify-center gap-1.5 mb-1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0"/></svg></span>Online to Cash</button>
    </div>

    <button id="do-transfer-btn" class="w-full py-4 rounded-3xl bg-charcoal text-white font-black text-[15px] flex items-center justify-center gap-2">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v13.5M7 5 3.5 8.5M7 5l3.5 3.5"/><path d="M17 19V5.5M17 19l3.5-3.5M17 19l-3.5-3.5"/></svg><span>Confirm Transfer</span>
    </button>
    <p id="transfer-error" class="hidden text-center text-[12px] font-bold text-crimson mt-3"></p>
  </section>

  <!-- Income History -->
  <section>
    <h2 class="text-[20px] font-black mb-3">Wallet History</h2>
    <div id="income-list" class="flex flex-col gap-3"></div>
    <div id="income-empty" class="hidden text-center py-10">
      <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-sage/15 flex items-center justify-center text-sage"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M5.5 9v0M18.5 15v0"/></svg></div>
      <p class="text-[14px] font-bold text-sage">No pocket money or transfers yet.</p>
    </div>
  </section>

</div>

<div id="bottom-nav"></div>

<script type="module" src="js/wallet.js"></script>
</body>
</html>
